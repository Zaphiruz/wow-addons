# Releases one addon when a tag like "Hawker/v0.1.0" is pushed:
#   1. checks the tag matches the .toc version and the changelog covers it
#   2. runs that addon's tests
#   3. builds dist/<Addon>-<version>.zip
#   4. uploads it to CurseForge (needs the CF_API_TOKEN repository secret
#      and "## X-Curse-Project-ID:" in the addon's .toc)
#   5. creates a GitHub release with the zip attached
#
# gander-release.yml calls this with a tag it made itself, because a tag
# pushed by a workflow doesn't start another workflow.
name: Release

on:
  push:
    tags: ["*/v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, like GanderData/v1.0.1
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TOOLS: mods/classic/tools
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa

      - name: Read tag
        id: tag
        run: |
          read -r addon version < <(python "$TOOLS/release.py" tag "$TAG")
          echo "addon=$addon" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A GitHub release that already exists means this version was released by
      # hand (for example a first upload made while creating the CurseForge
      # project). Uploading again would make a duplicate, so stop after testing.
      - name: Released by hand already?
        id: manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A GitHub release for $TAG already exists, so it was released by hand. Skipping the upload."
          fi

      - name: Check version and changelog
        run: python "$TOOLS/release.py" check "${{ steps.tag.outputs.addon }}" "${{ steps.tag.outputs.version }}"

      - name: Test
        run: python "$TOOLS/run_tests.py" "${{ steps.tag.outputs.addon }}"

      - name: Package
        run: python "$TOOLS/package.py" "${{ steps.tag.outputs.addon }}"

      - name: Upload to CurseForge
        if: steps.manual.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python "$TOOLS/release.py" upload "${{ steps.tag.outputs.addon }}"

      - name: GitHub release
        if: steps.manual.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON: ${{ steps.tag.outputs.addon }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python "$TOOLS/release.py" notes "$ADDON" > notes.md
          gh release create "$TAG" "mods/classic/dist/$ADDON-$VERSION.zip" \
            --title "$ADDON $VERSION" --notes-file notes.md
