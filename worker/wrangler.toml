# The Cloudflare Worker that files what the page (site/) sends as issues.
# Deploy it from the repository's top folder with:
#   npx wrangler deploy --config worker/wrangler.toml
# Its two secrets are not in this file. See README.md.
name = "gander-data"
main = "gander-worker.mjs"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
REPO = "Zaphiruz/wow-addons"
ALLOWED_ORIGIN = "https://zaphiruz.github.io"
